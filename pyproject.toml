[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartrebalance_zgz"
version = "0.3.3"
description = "Pipeline ETL, modelado predictivo y optimización de rutas para Bizi Zaragoza"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "osmnx>=1.9.0",
    "networkx>=3.2.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
notebooks = [
    "optuna>=3.6.0",
    "shap>=0.45.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.scripts]
smartrebalance-train = "modeling.train:main"
smartrebalance-predict = "modeling.predict:main"

[tool.setuptools.packages.find]
where = ["src"]