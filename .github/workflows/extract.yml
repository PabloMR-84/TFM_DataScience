name: Extracción Automática Bizi Zaragoza

on:
  workflow_dispatch: # Disparado cada 10 min desde cron-job.org (y manualmente desde GitHub)

concurrency:
  group: bizi-extraction
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de extracción
        env:
          BIZI_API_KEY: ${{ secrets.BIZI_API_KEY }}
        run: python extract.py

      - name: Hacer commit y push de los archivos Parquet
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/raw/historical/*.parquet
          git commit -m "chrono: auto-extracción parquet [skip ci]" || echo "No hay cambios para subir"
          git pull --rebase
          git push